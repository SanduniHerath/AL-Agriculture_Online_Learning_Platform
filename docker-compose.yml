# Local development services. Start with:  pnpm db:up   (or: docker compose up -d)
# Adminer UI: http://localhost:8080  (System: MySQL, Server: mysql, user/pass from .env)
services:
  mysql:
    image: mysql:8.4
    container_name: al_agri_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-al_agri}
      MYSQL_USER: ${MYSQL_USER:-al_agri}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-al_agri}
      TZ: Asia/Colombo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+05:30
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: al_agri_adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  mysql_data:
