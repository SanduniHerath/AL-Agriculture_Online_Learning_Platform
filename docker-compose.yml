# Local development services. Start with:  pnpm db:up   (or: docker compose up -d)
# MySQL:   localhost:3307 (3307, not 3306, so it never clashes with a MySQL installed on the PC)
# Adminer: http://localhost:8080  (System: MySQL, Server: mysql, user/pass from .env)
services:
  mysql:
    image: mysql:8.4
    container_name: al_agri_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-al_agri}
      MYSQL_USER: ${MYSQL_USER:-al_agri}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-al_agri}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Store timestamps in UTC (what Prisma expects). The apps display Asia/Colombo time.
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, when the data volume is first created (dev-only grants + test database).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Ping over TCP (127.0.0.1) so the check only passes once the real server is up,
      # not during the temporary server MySQL runs while initialising.
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: al_agri_adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  mysql_data:
